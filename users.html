<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management — __BRAND_NAME__</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --purple:#3D0C45;--purple-mid:#5C1F6B;--purple-light:#7B3094;
  --gold:#C9A84C;--gold-bright:#E8C96A;--gold-dim:#8A7235;
  --dark:#0D0910;--dark-2:#150D1A;--dark-3:#1E1227;--surface:#1A0F21;
  --border:rgba(201,168,76,0.18);--border-strong:rgba(201,168,76,0.38);
  --text:#F0E8D0;--text-dim:#9A8E7A;--text-muted:#5C5248;
  --green:#4CAF7A;--red:#CF4A4A;--radius:4px;--radius-lg:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--purple-mid) 28%,transparent) 0%,transparent 65%);pointer-events:none;z-index:0}
.topbar{background:linear-gradient(180deg,var(--purple) 0%,var(--dark-2) 100%);border-bottom:1px solid var(--border-strong);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:1rem;position:relative;z-index:1}
.topbar-symbol{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--gold)}
.topbar-title{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.25em;color:var(--gold-dim);text-transform:uppercase}
.topbar-nav-links{display:flex;gap:.5rem;position:absolute;left:50%;transform:translateX(-50%)}
.topbar-nav-links a{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.15em;color:var(--text-dim);text-decoration:none;padding:.35rem .8rem;border:1px solid var(--border);border-radius:4px}
.topbar-nav-links a.active{color:var(--gold);border-color:var(--gold-dim);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.topbar-user{display:flex;align-items:center;gap:1rem;margin-left:auto;position:relative;z-index:1}
.user-badge{display:flex;align-items:center;gap:.6rem;background:color-mix(in srgb,var(--gold) 8%,transparent);border:1px solid var(--border);padding:.35rem .9rem;border-radius:20px}
.user-name{font-family:'Cinzel',serif;font-size:.7rem;color:var(--gold);letter-spacing:.1em}
.role-tag{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px;font-family:'Cinzel',serif}
.role-admin{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);border:1px solid var(--gold-dim)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border:none;border-radius:var(--radius);font-weight:600}
.btn-sm{padding:.4rem .9rem;font-size:.6rem}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:rgba(207,74,74,.15);color:var(--red);border:1px solid rgba(207,74,74,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--dark);border:none}
.content{position:relative;z-index:1;padding:2rem;max-width:1200px;margin:0 auto}
.page-header{margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.page-title{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--gold)}
.page-subtitle{font-style:italic;color:var(--text-dim);font-size:.875rem;margin-top:.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;color:var(--gold-dim);text-transform:uppercase;padding:.75rem 1rem;text-align:left}
td{padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.65rem;font-family:'Cinzel',serif;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.badge-admin{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}
.badge-moderator{background:rgba(192,132,208,.15);color:#C084D0;border:1px solid rgba(192,132,208,.25)}
.badge-officer{background:rgba(91,141,217,.15);color:#5B8DD9;border:1px solid rgba(91,141,217,.3)}
.badge-member{background:rgba(255,255,255,.06);color:var(--text-dim);border:1px solid var(--border)}
.badge-active{background:rgba(76,175,122,.1);color:var(--green);border:1px solid rgba(76,175,122,.2)}
.badge-inactive{background:rgba(207,74,74,.1);color:var(--red);border:1px solid rgba(207,74,74,.2)}
.points-num{font-family:'Cinzel',serif;color:var(--gold)}
.text-dim{color:var(--text-dim)}
.search-bar{margin-bottom:1rem}
.search-input{background:var(--dark-3);border:1px solid var(--border);color:var(--text);padding:.5rem 1rem;font-family:'Crimson Pro',serif;font-size:.9rem;outline:none;border-radius:var(--radius);min-width:220px}
.search-input:focus{border-color:var(--gold-dim)}
.action-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.form-group{margin-bottom:1.25rem}
.form-label{display:block;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:.5rem}
.form-input{width:100%;background:var(--dark-3);border:1px solid var(--border);color:var(--text);padding:.75rem 1rem;font-family:'Crimson Pro',serif;font-size:1rem;outline:none;border-radius:var(--radius)}
.form-input:focus{border-color:var(--gold)}
.error-msg{color:var(--red);font-size:.875rem;margin-top:.5rem;display:none;font-style:italic}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;opacity:0;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);width:100%;max-width:480px}
.modal-header{background:linear-gradient(135deg,var(--purple) 0%,var(--dark-2) 100%);padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.75rem;justify-content:flex-end}
#toast-container{position:fixed;top:1rem;right:1rem;z-index:9999}
.toast{background:var(--surface);border:1px solid var(--border);padding:.8rem 1.2rem;border-radius:var(--radius);margin-bottom:.5rem}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.empty-state{text-align:center;padding:3rem;color:var(--text-muted);font-style:italic}
@media(max-width:768px){.topbar-nav-links{display:none}.content{padding:1rem}}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/bug-report.js"></script>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">
    <span class="topbar-symbol">__BRAND_LETTERS__</span>
    <span class="topbar-title">User Management</span>
  </div>
  <div class="topbar-nav-links">
    <a href="/points">⚔ Points</a>
    <a href="/budget">◈ Budget</a>
    <a href="/wheel">🎡 Wheel</a>
    <a href="/dailies">📋 Dailies</a>
  </div>
  <div class="topbar-user">
    <div class="user-badge">
      <span class="user-name" id="topbar-username"></span>
      <span class="role-tag role-admin" id="topbar-role"></span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<div class="content">
  <div class="page-header">
    <div>
      <div class="page-title">User Management</div>
      <div class="page-subtitle">Manage brotherhood member accounts</div>
    </div>
    <button class="btn btn-gold btn-sm" onclick="openAddUser()">+ Add Member</button>
  </div>
  <div class="card">
    <div class="search-bar">
      <input class="search-input" id="user-search" placeholder="Search members..." oninput="filterUsers()">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Points</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<div class="modal-overlay" id="modal-add-user">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add New Member</span>
      <button class="modal-close" onclick="closeModal('modal-add-user')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="add-username" placeholder="Username"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="add-email" placeholder="email@example.com"></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="add-password" placeholder="Password"></div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="add-role">
          <option value="member">Member</option>
          <option value="officer">Officer</option>
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="error-msg" id="add-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-add-user')">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="createUser()">Create Member</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-edit-user">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Member</span>
      <button class="modal-close" onclick="closeModal('modal-edit-user')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-uid">
      <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="edit-username"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="edit-email"></div>
      <div class="form-group"><label class="form-label">New Password <span class="text-dim">(leave blank to keep)</span></label><input class="form-input" type="password" id="edit-password" placeholder="New password"></div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="edit-role">
          <option value="member">Member</option>
          <option value="officer">Officer</option>
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="edit-active">
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
      </div>
      <div class="error-msg" id="edit-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-edit-user')">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveUser()">Save Changes</button>
    </div>
  </div>
</div>

<script src="/admin-settings.js"></script>
<script>
let allUsers = [];
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function roleBadge(role) { return `<span class="badge badge-${esc(role)}">${esc(role)}</span>`; }
function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
async function doLogout() {
  await fetch('/api/logout', {method:'POST'});
  window.location.href = '/';
}
async function loadUsers() {
  const r = await fetch('/points/api/users');
  if (r.status === 403) { window.location.href = '/'; return; }
  allUsers = await r.json();
  renderUsers(allUsers);
}
function renderUsers(users) {
  const tbody = document.getElementById('users-body');
  if (users.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">No users found</div></td></tr>`;
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td class="text-dim">${u.user_id}</td>
      <td style="font-family:'Cinzel',serif;font-size:0.85rem;">${esc(u.username)}</td>
      <td class="text-dim" style="font-size:0.85rem;">${esc(u.email)}</td>
      <td>${roleBadge(u.role)}</td>
      <td><span class="points-num">${u.brotherhood_points}</span></td>
      <td>${u.is_active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
      <td class="text-dim" style="font-size:0.8rem;">${fmtDate(u.created_at)}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-ghost btn-sm" onclick="openEditUser(${u.user_id})">Edit</button>
          ${u.is_active ? `<button class="btn btn-danger btn-sm" onclick="deactivateUser(${u.user_id})">Deactivate</button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');
}
function filterUsers() {
  const q = document.getElementById('user-search').value.toLowerCase();
  renderUsers(allUsers.filter(u => u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)));
}
function openAddUser() {
  ['add-username','add-email','add-password'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-role').value = 'member';
  document.getElementById('add-error').style.display = 'none';
  openModal('modal-add-user');
}
async function createUser() {
  const data = {
    username: document.getElementById('add-username').value.trim(),
    email: document.getElementById('add-email').value.trim(),
    password: document.getElementById('add-password').value,
    role: document.getElementById('add-role').value
  };
  if (!data.username || !data.email || !data.password) { showErr('add-error','All fields are required'); return; }
  const r = await fetch('/points/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  const d = await r.json();
  if (d.success) { toast('Member created!','success'); closeModal('modal-add-user'); loadUsers(); }
  else showErr('add-error', d.error||'Error creating user');
}
function openEditUser(uid) {
  const u = allUsers.find(x => x.user_id === uid);
  if (!u) return;
  document.getElementById('edit-uid').value = uid;
  document.getElementById('edit-username').value = u.username;
  document.getElementById('edit-email').value = u.email;
  document.getElementById('edit-password').value = '';
  document.getElementById('edit-role').value = u.role;
  document.getElementById('edit-active').value = u.is_active ? '1' : '0';
  document.getElementById('edit-error').style.display = 'none';
  openModal('modal-edit-user');
}
async function saveUser() {
  const uid = document.getElementById('edit-uid').value;
  const data = {
    username: document.getElementById('edit-username').value.trim(),
    email: document.getElementById('edit-email').value.trim(),
    role: document.getElementById('edit-role').value,
    is_active: document.getElementById('edit-active').value,
    password: document.getElementById('edit-password').value
  };
  if (!data.username || !data.email) { showErr('edit-error','Username and email are required'); return; }
  const r = await fetch(`/points/api/users/${uid}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  const d = await r.json();
  if (d.success) { toast('Member updated!','success'); closeModal('modal-edit-user'); loadUsers(); }
  else showErr('edit-error', d.error||'Error saving user');
}
async function deactivateUser(uid) {
  if (!confirm('Deactivate this member?')) return;
  const r = await fetch(`/points/api/users/${uid}`, {method:'DELETE'});
  const d = await r.json();
  if (d.success) { toast('Member deactivated'); loadUsers(); }
  else toast('Error','error');
}
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
});
(async () => {
  const r = await fetch('/api/me');
  const d = await r.json();
  if (!d.authenticated || d.role !== 'admin') { window.location.href = '/'; return; }
  document.getElementById('topbar-username').textContent = d.username.toUpperCase();
  document.getElementById('topbar-role').textContent = d.role;
  if (window.initBugHelp) initBugHelp(d);
  initAdminCog(d);
  loadUsers();
})();
</script>
</body>
</html>
